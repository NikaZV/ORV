name: 29934_deploy
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["29934_test"]
    types: [completed]

jobs:
  build_and_push:
    # skripta se zazene samo ce se je tset uspesno zakljucil
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Prenos artefakta
        uses: actions/download-artifact@v4
        with:
          name: preverjanje-napak
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      
      - name: Kontrola napak
        run: | 
          if [ ! -f napaka.txt ]; then
            echo "Atrefakt napaka.txt ne obstaja"
            exit 1
          fi
          if [ -s napaka.txt ]; then
            echo "Najdena napaka v artefaktu"
            exit 1
          fi
      
      - name: Prijava v DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Gradnja in potisk na DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/29934-projekt:latest


          
